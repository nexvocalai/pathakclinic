server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}
  application:
    name: pathak-clinic-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pathak_clinic;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:pathak-clinic-local-development-secret-key-change-in-production-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://130.210.11.179}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  whatsapp:
    doctor-phone: ${WHATSAPP_DOCTOR_PHONE:917023961282}
    api-url: ${WHATSAPP_API_URL:}
    api-token: ${WHATSAPP_API_TOKEN:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:8971787865:AAGH10zcyQW9Ykirxb8NO-F0GG5qMtZhrPI}
    chat-id: ${TELEGRAM_CHAT_ID:787573263}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.pathak.clinic: INFO
